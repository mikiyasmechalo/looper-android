name: Build and Release Looper Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0-beta1)'
        required: false
        default: 'v1.0.0-beta1'
      is_prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore (Optional)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks
          else
            echo "No KEYSTORE_BASE64 secret found; build will use debug signing fallback."
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        id: prepare-artifacts
        run: |
          VERSION="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="v1.0.0-beta1"
          fi
          echo "Release version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          mkdir -p release-artifacts

          # Locate APK output
          APK_SRC=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)

          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "release-artifacts/Looper-${VERSION}.apk"
            echo "Copied APK to release-artifacts/Looper-${VERSION}.apk"
          else
            echo "Error: APK not found!" && exit 1
          fi

          # Generate SHA-256 Checksums
          cd release-artifacts
          sha256sum Looper-${VERSION}.apk > checksums.txt
          cat checksums.txt
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: looper-release-${{ steps.prepare-artifacts.outputs.version }}
          path: release-artifacts/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.prepare-artifacts.outputs.version }}
          name: "Looper Android ${{ steps.prepare-artifacts.outputs.version }}"
          prerelease: ${{ github.event.inputs.is_prerelease || contains(steps.prepare-artifacts.outputs.version, 'beta') || contains(steps.prepare-artifacts.outputs.version, 'alpha') }}
          files: release-artifacts/*
          generate_release_notes: true
          body: |
            ### 🎧 Looper for Android ${{ steps.prepare-artifacts.outputs.version }}

            Welcome to the Beta release of **Looper for Android**—a native Jetpack Compose & Media3/ExoPlayer local music player built with Material 3 Expressive aesthetics, dynamic blur, offline lyrics, and interactive Glance home screen widgets!

            #### 📦 Downloads
            - **Universal APK**: Direct install on Android 7.0+ (API 24+) devices.
            - **Checksums**: SHA-256 verification hash for download integrity.

            #### 🔒 Integrity & Security
            Verify your download using SHA-256:
            ```bash
            sha256sum -c checksums.txt
            ```

            *Built automatically via GitHub Actions.*

